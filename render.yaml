# Render blueprint for the ScoreHub API.
#
# In Render: New -> Blueprint -> point at this repo. It picks this file up and
# creates the service. Then set the two `sync: false` variables below in the
# dashboard — they are not committed because they are environment-specific.
#
#   MONGO_URI      your MongoDB Atlas connection string
#   CLIENT_ORIGIN  the GitHub Pages ORIGIN, e.g. https://yourname.github.io
#                  (origin only — no /scorehub path, no trailing slash)

services:
  - type: web
    name: scorehub-api
    runtime: node
    plan: free
    region: oregon
    branch: main

    # Installs both workspaces; the server is what actually runs.
    buildCommand: npm install
    startCommand: npm start

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
