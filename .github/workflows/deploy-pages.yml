name: Deploy client to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check the API URL is configured
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Repository variable API_URL is not set."
            echo "::error::Set it under Settings -> Secrets and variables -> Actions -> Variables."
            echo "::error::It must be the full URL of your deployed API, e.g. https://scorehub-api.onrender.com"
            exit 1
          fi
          echo "Building against API: $API_URL"

      - name: Build client
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Add SPA fallback and disable Jekyll
        run: |
          cp client/dist/index.html client/dist/404.html
          touch client/dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
